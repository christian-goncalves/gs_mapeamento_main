          - generic [ref=f10e1363]: Passe o mouse sobre um município ou um ponto para ver o nome. Os pontos seguem os filtros do dashboard (CSA, escala populacional e acessibilidade) e o botão de localidades fechadas.
        - paragraph [ref=f10e1364]: "Fontes: planilha INDICADORES_GEORREFERENCIADOS_BAHIA (aba “GRUPOS CSAs BA 3T26”, 3T26). A planilha traz 37 grupos: 36 do CSR Brasil e 1 do CSR Nordeste (Misericórdia, em Juazeiro, CSA Mandacaru); o filtro por CSR separa os dois. A população de cada município e a escala populacional vêm da planilha Escala_Populacional_UF_BA (rotulada Censo 2022 do IBGE, 417 municípios, total 14.659.023); todos os municípios do GeoJSON constam nela, com duas diferenças de grafia (Muquém de São Francisco / do São Francisco e Santa Teresinha / Terezinha). Acessibilidade: a coluna está em branco para todos os grupos, então todos aparecem como “Sem registro”. Retorno à Vida (Jequié) fica a cerca de 11 km fora do município indicado e Ondina (Salvador), a 0,4 km; mantive as coordenadas da planilha. Dois grupos compartilham a mesma coordenada, e o pino foi afastado alguns metros. Localidades fechadas: planilha LOCALIDADES_GRUPOS_FECHADOS_BA (aba GRPS FECHADOS 2026, 9 localidades); o grupo aberto mais próximo foi calculado em linha reta. As localidades não têm dado de acessibilidade, então o filtro de acessibilidade as oculta. Escala populacional: na pizza, “sem grupo” são os 401 municípios sem grupo aberto, inclusive as 9 localidades fechadas; 16 dos 417 municípios têm grupo aberto. Mapa de municípios: GeoJSON da Bahia, simplificado para a web."
