          - paragraph [ref=f7e1218]: "Fontes: planilha INDICADORES_GEORREFERENCIADOS_BRASIL_SUL_SC (aba GRUPOS CSAs Brasil SUL 3T26). População dos municípios: Censo 2022 do IBGE, pelas tabelas de municípios da planilha CSR Brasil. Acessibilidade: o código 0 e as células vazias da planilha foram tratados como “Sem registro”. Localidades fechadas: planilha LOCALIDADES_GRUPOS_FECHADOS (aba GRPS FECHADOS 2026). A planilha não indica o grupo mais próximo: calculei em linha reta, entre cada localidade e os grupos abertos. Elas não têm dado de acessibilidade, então o filtro de acessibilidade as oculta. Escala populacional: planilha Escala_Populacional_UF_SC (294 municípios, IBGE 2022). Urussanga está no mapa, mas não consta na planilha de escala: aparece como “Sem dado”. Pescaria Brava e Balneário Rincão constam na planilha, mas não existem no GeoJSON do mapa (293 municípios); o grupo Sol Nascente (Balneário Rincão) segue no mapa, com a coordenada da planilha. Balneário Rincão e São Francisco do Sul têm grupo e constam como “ISOLADO” na planilha de escala; prevaleceu a planilha de grupos para definir quem tem grupo."
